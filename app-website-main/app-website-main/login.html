<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up Portal</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <img src="BEYOND THE BELL (1).png" alt="Logo" class="logo">
            <h2>Welcome Back!</h2>
            <p class="subtitle">Please enter log in details below</p>
            <form>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <div class="forgot-row">
                    <a href="#" class="forgot">Forgot password?</a>
                </div>
                <button type="button" onclick="window.location.href='app.html' "class="sign-in">Login</button>
            </form>
            <div class="or">or continue</div>
            <button class="google-btn">
                <div class="google-icon">
                </div>
                Log in with Google
            </button>
            <p class="signup-link">
                Don't have an account? <a href="#">Sign Up</a>
            </p>
        </div>
    </div>
</body>
</html>
